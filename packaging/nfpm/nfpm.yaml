name: mechanix-files
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Yogita Hiray <yogitah@mechasystems.com>"
description: Mechanix Files application
homepage: https://github.com/mecha-org/mechanix-files.git
license: BSD

contents:
  - src: ./stage/bundle/mechanix_files
    dst: /usr/share/mechanix/mechanix-files/mechanix_files
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib
    dst: /usr/share/mechanix/mechanix-files/lib
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-files/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_files
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
