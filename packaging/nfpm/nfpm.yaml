name: mechanix-files
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Yogita Hiray <yogitah@mechasystems.com>"
description: Mechanix Files application
homepage: https://github.com/mecha-org/mechanix-files.git
license: BSD

overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.0
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.0)"

contents:
  - src: ./stage/bundle/mechanix_files
    dst: /usr/share/mechanix/mechanix-files/mechanix_files
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-files/lib/libapp.so
  - src: ./stage/bundle/lib/libaudioplayers_elinux_plugin.so
    dst: /usr/share/mechanix/mechanix-files/lib/libaudioplayers_elinux_plugin.so
  - src: ./stage/bundle/lib/libvideo_player_elinux_plugin.so
    dst: /usr/share/mechanix/mechanix-files/lib/libvideo_player_elinux_plugin.so
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-files/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_files
    file_info:
      mode: 0755
  - src: ./org.mechanix.files.desktop
    dst: /usr/share/applications/org.mechanix.files.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.files.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
